services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: joblab
      POSTGRES_USER: joblab
      POSTGRES_PASSWORD: joblab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblab -d joblab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  django:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: joblab.settings
      DJANGO_SECRET_KEY: local-dev-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django,nginx
      AI_PROVIDER: MOCK
      DB_ENGINE: postgres
      DB_NAME: joblab
      DB_USER: joblab
      DB_PASSWORD: joblab
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  flask:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      FLASK_APP: app.py
    ports:
      - "5000:5000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      django:
        condition: service_started
      flask:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
