# JobLab API Gateway (Nginx). Single public entry point of the ecosystem.
#
#   /api/v1/plans/...            -> plan-service   (legacy route strangled from Django)
#   /api/v2/plans/...            -> plan-service
#   /api/v2/organizational-plan/ -> plan-service   (Taller 02 route)
#   /api/v2/public/...           -> plan-service   (JSON service provided to the allied team)
#   /api/v2/rates|salaries|ally  -> integration-service (third-party API + allied team)
#   /api/v2/reports|notifications-> report-service (Celery + Redis)
#   /static/                     -> files collected by Django
#   /                            -> Django (HTML front end, admin, i18n)

upstream django_app        { server django:8000;              keepalive 16; }
upstream plan_service      { server plan-service:5000;        keepalive 16; }
upstream integration_svc   { server integration-service:5000; keepalive 8; }
upstream report_svc        { server report-service:5000;      keepalive 8; }

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=write_per_ip:10m rate=2r/s;
limit_req_status 429;

# Reuse the caller's correlation id or create one; every service logs and echoes it.
map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Plan generation (POST) is expensive: a stricter per-IP limit applies only to writes.
map $request_method $write_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $write_limit_key zone=plan_writes:10m rate=1r/s;

log_format gateway '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time '
                   'rid=$correlation_id';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log gateway;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json text/css application/javascript text/csv;

    add_header X-Request-ID $correlation_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 90s;
    # Retry another attempt only for connection problems; Nginx never retries non-idempotent POSTs.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    error_page 502 504 = @service_unavailable;

    location = /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx-gateway"}';
    }

    location @service_unavailable {
        default_type application/json;
        add_header X-Request-ID $correlation_id always;
        return 503 '{"error":{"code":"service_unavailable","detail":"The upstream service is not available. Try again in a few seconds."}}';
    }

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # ---- plan-service --------------------------------------------------------------
    location /api/v1/plans/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req zone=plan_writes burst=5 nodelay;
        proxy_pass http://plan_service;
    }

    location /api/v2/plans/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req zone=plan_writes burst=5 nodelay;
        proxy_pass http://plan_service;
    }

    location = /api/v2/organizational-plan/ {
        limit_req zone=write_per_ip burst=5 nodelay;
        proxy_pass http://plan_service;
    }

    location /api/v2/public/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        # Public read-only JSON consumed by the allied team from another origin.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header X-Request-ID $correlation_id always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://plan_service;
    }

    # ---- integration-service -------------------------------------------------------
    location ~ ^/api/v2/(rates|salaries|ally)/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://integration_svc;
    }

    # ---- report-service ------------------------------------------------------------
    location ~ ^/api/v2/(reports|notifications)/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://report_svc;
    }

    # ---- Django (HTML front end, admin, i18n, remaining legacy API) ----------------
    location / {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://django_app;
    }
}
