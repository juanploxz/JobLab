name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify translation catalogs
        run: python scripts/i18n.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django system checks
        run: python manage.py check
      - name: Run tests
        run: python manage.py test

  microservices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [plan_service, integration_service, report_service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt fakeredis
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  compose-smoke:
    # Builds every image and runs the full ecosystem (Nginx, Django, 3 Flask services,
    # Celery worker, PostgreSQL and Redis), then exercises it through the gateway.
    runs-on: ubuntu-latest
    needs: [django, microservices]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the gateway
        run: bash deploy/aws/smoke-test.sh http://127.0.0.1
      - name: Asynchronous report end to end
        run: |
          PLAN_ID=$(curl -fsS http://127.0.0.1/api/v2/plans/ | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['id'])")
          TASK=$(curl -fsS -H "Content-Type: application/json" -d "{\"plan_id\": $PLAN_ID, \"format\": \"csv\"}" http://127.0.0.1/api/v2/reports/ | python3 -c "import sys,json; print(json.load(sys.stdin)['task_id'])")
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS http://127.0.0.1/api/v2/reports/$TASK/ | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "report status: $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            sleep 2
          done
          test "$STATUS" = "SUCCESS"
          curl -fsS http://127.0.0.1/api/v2/reports/$TASK/download/ | head -n 5
          curl -fsS "http://127.0.0.1/api/v2/notifications/" | python3 -c "import sys,json; kinds=[n['type'] for n in json.load(sys.stdin)['results']]; print(kinds); assert 'plan.created' in kinds and 'report.ready' in kinds"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
